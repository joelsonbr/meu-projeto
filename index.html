<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Meu Site</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Fazer Login</h2>

      <div class="input-group">
        <label for="email_usuario">Nome de Usuário ou Email:</label>
        <input type="text" id="email_usuario" required />
      </div>

      <div class="input-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required />
      </div>

      <button type="submit" id="btn" class="btn-login">Entrar</button>

      <!-- O link que você pediu -->
      <p class="signup-link">
        Não tem uma conta? <a href="#">Cadastre-se agora</a>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
